<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1a1d29 0%, #0d0f16 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e8eaf0;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .score {
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      color: #9aa3b8;
    }

    .score span {
      color: #4ade80;
      font-weight: 700;
      font-size: 1.3rem;
    }

    .board-wrap {
      position: relative;
    }

    canvas {
      display: block;
      background: #12141d;
      border: 2px solid #2a2e40;
      border-radius: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: rgba(10, 12, 18, 0.82);
      border-radius: 10px;
      backdrop-filter: blur(3px);
    }

    .overlay.hidden {
      display: none;
    }

    .overlay .message {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .overlay .sub {
      font-size: 0.95rem;
      color: #9aa3b8;
    }

    .btn {
      padding: 0.7rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #0d0f16;
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 6px 18px rgba(74, 222, 128, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(74, 222, 128, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .food-picker {
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #9aa3b8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .food-picker input {
      width: 3.5rem;
      padding: 0.3rem 0.5rem;
      background: #1a1d29;
      color: #e8eaf0;
      border: 2px solid #2a2e40;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .food-picker input:focus {
      border-color: #4ade80;
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #6b7288;
    }
  </style>
</head>
<body>
  <h1 class="title">SNAKE</h1>
  <div class="score">Score : <span id="score">0</span></div>
  <div class="food-picker">Pommes : <input type="number" id="foodCount" min="1" max="10" value="1"></div>

  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="message" id="overlayMessage">Prêt à jouer ?</div>
      <div class="sub" id="overlaySub">Utilise les flèches pour diriger le serpent</div>
      <button class="btn" id="startBtn">Jouer</button>
    </div>
  </div>

  <p class="hint">Flèches ↑ ↓ ← → pour se déplacer</p>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayMessage = document.getElementById('overlayMessage');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');
    const foodCountInput = document.getElementById('foodCount');

    const GRID = 20;                  // taille d'une case en pixels
    const COLS = canvas.width / GRID; // 20 colonnes
    const ROWS = canvas.height / GRID; // 20 lignes

    const BASE_SPEED = 140;           // ms par tick au départ
    const MIN_SPEED = 60;             // vitesse max
    const SPEED_STEP = 15;            // accélération toutes les 5 pommes

    let snake, dir, nextDir, foods, score, speed, running, loopTimer, targetFoods;

    function reset() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = BASE_SPEED;
      running = false;
      scoreEl.textContent = '0';
      targetFoods = Math.max(1, Math.min(10, parseInt(foodCountInput.value) || 1));
      placeFoods();
      draw();
    }

    function placeFoods() {
      foods = [];
      for (let i = 0; i < targetFoods; i++) {
        let ok = false;
        while (!ok) {
          const fx = Math.floor(Math.random() * COLS);
          const fy = Math.floor(Math.random() * ROWS);
          ok = !snake.some(s => s.x === fx && s.y === fy)
              && !foods.some(f => f.x === fx && f.y === fy);
          if (ok) foods.push({ x: fx, y: fy });
        }
      }
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Collision mur
      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Collision lui-même
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      const foodIdx = foods.findIndex(f => f.x === head.x && f.y === head.y);
      if (foodIdx !== -1) {
        foods.splice(foodIdx, 1);
        score += 1;
        scoreEl.textContent = String(score);
        // Vitesse +15ms toutes les 5 pommes, plafonnée
        if (score % 5 === 0) {
          speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
          restartLoop();
        }
        placeFoods();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Léger damier pour la lisibilité
      ctx.fillStyle = '#141826';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          if ((x + y) % 2 === 0) {
            ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
          }
        }
      }

      // Pommes
      ctx.fillStyle = '#ef4444';
      foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(
          f.x * GRID + GRID / 2,
          f.y * GRID + GRID / 2,
          GRID / 2 - 3,
          0,
          Math.PI * 2
        );
        ctx.fill();
      });

      // Serpent
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.fillStyle = isHead ? '#4ade80' : '#22c55e';
        ctx.globalAlpha = isHead ? 1 : Math.max(0.4, 1 - i * 0.03);
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
        ctx.globalAlpha = 1;

        // Yeux sur la tête
        if (isHead) {
          ctx.fillStyle = '#0d0f16';
          const cx = seg.x * GRID + GRID / 2;
          const cy = seg.y * GRID + GRID / 2;
          ctx.beginPath();
          ctx.arc(cx + 3, cy - 3, 1.8, 0, Math.PI * 2);
          ctx.arc(cx - 3, cy - 3, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function restartLoop() {
      clearInterval(loopTimer);
      loopTimer = setInterval(step, speed);
    }

    function startGame() {
      reset();
      overlay.classList.add('hidden');
      running = true;
      restartLoop();
    }

    function gameOver() {
      running = false;
      clearInterval(loopTimer);
      overlayMessage.textContent = 'Game Over !';
      overlaySub.textContent = 'Score final : ' + score;
      startBtn.textContent = 'Rejouer';
      overlay.classList.remove('hidden');
    }

    function handleKey(e) {
      const k = e.key;
      if (k === 'ArrowUp' && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if (k === 'ArrowDown' && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if (k === 'ArrowLeft' && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if (k === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
      else return;
      e.preventDefault();
    }

    document.addEventListener('keydown', handleKey);
    startBtn.addEventListener('click', startGame);

    reset();
  </script>
</body>
</html>
